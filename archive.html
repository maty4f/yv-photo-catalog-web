<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול הארכיון — עץ ורשומות</title>
<link rel="stylesheet" href="yv-theme.css?v=20260823a">
<style>
  /* ── archive.html — the management screen: tree · record card · context rail.
     Design notes: reports/idea-style-archive-system-plan-20260914.html §2.
     Layout follows the archival-system convention (AtoM / ArchivesSpace):
     hierarchy beside the record, ISAD(G) areas as sections, context on the
     far side. RTL: tree on the RIGHT (first grid column), rail on the left. */
  :root { --accent:var(--brand); --accent-2:var(--brand-hover); --accent-ink:var(--on-brand);
          --tree-w:300px; --rail-w:320px; }
  body { padding:0; direction:rtl; text-align:right; }
  .shell { min-height:100vh; display:flex; flex-direction:column; direction:rtl; }

  /* top bar */
  .topbar { display:flex; align-items:center; gap:18px; padding:12px 20px; border-bottom:1px solid var(--line);
            background:color-mix(in srgb, var(--card) 70%, var(--bg)); position:sticky; top:0; z-index:20; direction:rtl; }
  .topbar h1 { font-size:18px; margin:0; font-weight:800; white-space:nowrap; }
  .topbar .tenant { color:var(--muted); font-size:12.5px; margin-inline-start:6px; unicode-bidi:isolate; }
  .topbar .grow { flex:1; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:5px 12px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .stat b { color:var(--ink); font-size:14px; margin-inline-end:4px; font-variant-numeric:tabular-nums; unicode-bidi:isolate; }
  .stat.pub b { color:var(--good); } .stat.rev b { color:var(--warn); } .stat.cand b { color:var(--tik); }

  /* 3-pane layout — RTL grid: tree (right) · card · rail (left) */
  .layout { display:grid; grid-template-columns:var(--tree-w) minmax(0,1fr) var(--rail-w); gap:0; flex:1; direction:rtl; min-height:0; }
  .pane { min-width:0; }
  .tree-pane { border-inline-start:1px solid var(--line); background:color-mix(in srgb, var(--card) 45%, var(--bg));
               position:sticky; top:57px; height:calc(100vh - 57px); overflow:auto; display:flex; flex-direction:column; }
  .rail { border-inline-end:1px solid var(--line); background:color-mix(in srgb, var(--card) 45%, var(--bg));
          position:sticky; top:57px; height:calc(100vh - 57px); overflow:auto; padding:14px; }
  .card-pane { padding:18px 22px 60px; }

  /* tree */
  .tree-head { padding:12px 12px 8px; border-bottom:1px solid var(--line); }
  .tree-head input { font-size:13.5px; padding:8px 10px; }
  .tree-tools { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .tree-tools select { width:auto; padding:5px 8px; font-size:12px; }
  .tree-tools button { padding:5px 10px; font-size:12px; }
  /* the five Sapir catalogs — a strip of chips under the search (filter) + home fonds in the tree */
  :root { --library:#ff8fb1; --admin:#9fb3c8; }
  .cat-strip { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .cchip { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:6px; box-shadow:none; }
  .cchip:hover { color:var(--ink); box-shadow:none; background:var(--card-hover); }
  .cchip.on { color:var(--ink); border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--card)); }
  .cchip .kdot { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .cchip b { font-size:11px; color:var(--ink); font-variant-numeric:tabular-nums; }
  .cat-strip .gear { padding:3px 10px; font-size:12px; }
  .node.home .ttl { font-weight:700; }
  .node.home .kdot { width:9px; height:9px; }
  section.area.cat > h3 .pend { margin-inline-start:auto; font-size:11px; color:var(--warn); font-weight:400; border:1px solid color-mix(in srgb, var(--warn) 50%, transparent); border-radius:999px; padding:1px 8px; }
  .frow .v.locked { color:var(--muted); font-size:13px; }
  /* integration panel (the switch) */
  #integ-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-inline-start:6px; vertical-align:middle; }
  #integ-dot.on { background:var(--good); box-shadow:0 0 6px var(--good); }
  .integ-state { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 14px; border-radius:var(--radius); border:1px solid var(--line); background:var(--tint); }
  .integ-state .big { font-size:18px; font-weight:800; }
  .integ-state .big.on { color:var(--good); } .integ-state .big.off { color:var(--muted); }
  .integ-state .src { font-size:12px; color:var(--muted); }
  .checks { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:start; font-size:13.5px; }
  .checks .ok { color:var(--good); } .checks .bad { color:var(--error); }
  .checks small { display:block; color:var(--muted); font-size:11.5px; direction:ltr; text-align:right; unicode-bidi:isolate; }
  table.recent { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.recent th, table.recent td { text-align:right; padding:5px 6px; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  table.recent th { color:var(--muted); font-weight:600; font-size:11.5px; }
  table.recent td.ltr { direction:ltr; text-align:right; unicode-bidi:isolate; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; }
  .tree-body { flex:1; overflow:auto; padding:6px 4px 30px; }
  ul.tree, ul.tree ul { list-style:none; margin:0; padding:0; }
  ul.tree ul { padding-inline-start:14px; border-inline-start:1px dashed var(--line); margin-inline-start:9px; }
  .node { display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:6px; cursor:pointer; font-size:13.5px; line-height:1.35; }
  .node:hover { background:var(--card-hover); }
  .node.sel { background:color-mix(in srgb, var(--accent) 16%, var(--card)); outline:1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .node.target { outline:2px dashed var(--warn); }
  .node .tw { width:16px; flex:none; text-align:center; color:var(--muted); font-size:11px; user-select:none; }
  .node .tw.leaf { opacity:.35; }
  .node .lvl { flex:none; font-size:10.5px; padding:1px 6px; border-radius:4px; background:var(--tint); border:1px solid var(--line); color:var(--muted); }
  .node .ttl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; unicode-bidi:isolate; }
  .node .ttl small { color:var(--muted); font-size:11px; margin-inline-start:6px; direction:ltr; unicode-bidi:isolate; }
  .node .kdot { width:7px; height:7px; border-radius:50%; flex:none; background:var(--muted); }
  .kdot.photo { background:var(--photos); } .kdot.film { background:var(--films); } .kdot.doc { background:var(--docs); } .kdot.tik { background:var(--tik); }
  .node .st { flex:none; width:8px; height:8px; border-radius:2px; }
  .st.draft { background:var(--muted); } .st.draft_invalid { background:var(--error); } .st.in_review { background:var(--warn); }
  .st.published { background:var(--good); } .st.withdrawn { background:var(--line-strong); }
  .tree-empty { padding:20px 14px; color:var(--muted); font-size:13px; }
  ul.results { list-style:none; margin:0; padding:0; }
  .results li { padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13px; }
  .results li:hover { background:var(--card-hover); }
  .results li .path { color:var(--muted); font-size:11.5px; direction:ltr; unicode-bidi:isolate; text-align:right; }
  .results li .snip { color:var(--muted); font-size:12px; margin-top:2px; max-height:2.6em; overflow:hidden; }
  .move-banner { margin:8px 10px; padding:8px 10px; border-radius:var(--radius-sm); background:color-mix(in srgb, var(--warn) 14%, var(--card)); border:1px solid color-mix(in srgb, var(--warn) 45%, transparent); font-size:12.5px; color:var(--warn); display:none; }
  .move-banner.show { display:block; }

  /* record card */
  .empty { color:var(--muted); font-size:14px; padding:60px 20px; text-align:center; border:1px dashed var(--line); border-radius:var(--radius); }
  .empty b { color:var(--ink); }
  .crumbs { font-size:12.5px; color:var(--muted); margin-bottom:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .crumbs a { color:var(--accent); text-decoration:none; cursor:pointer; unicode-bidi:isolate; }
  .crumbs a:hover { text-decoration:underline; }
  .rec-head { display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .rec-head h2 { margin:0; font-size:22px; font-weight:800; line-height:1.3; flex:1; min-width:0; unicode-bidi:isolate; }
  .rec-head .en { font-family:Georgia,'Times New Roman',serif; color:var(--muted); font-size:15px; direction:ltr; text-align:left; unicode-bidi:isolate; margin-top:2px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 0; }
  .badge { font-size:11.5px; padding:2px 9px; border-radius:999px; border:1px solid var(--line-strong); background:var(--card); color:var(--muted); unicode-bidi:isolate; }
  .badge.kind.photo { color:var(--photos); border-color:color-mix(in srgb, var(--photos) 50%, transparent); }
  .badge.kind.film { color:var(--films); border-color:color-mix(in srgb, var(--films) 50%, transparent); }
  .badge.kind.doc { color:var(--docs); border-color:color-mix(in srgb, var(--docs) 50%, transparent); }
  .badge.kind.tik { color:var(--tik); border-color:color-mix(in srgb, var(--tik) 50%, transparent); }
  .badge.status.published { color:var(--good); border-color:color-mix(in srgb, var(--good) 55%, transparent); }
  .badge.status.in_review { color:var(--warn); border-color:color-mix(in srgb, var(--warn) 55%, transparent); }
  .badge.status.draft_invalid { color:var(--error); border-color:color-mix(in srgb, var(--error) 55%, transparent); }
  .badge.ref { font-family:ui-monospace,"SF Mono",Menlo,monospace; direction:ltr; }

  .savebar { position:sticky; top:57px; z-index:10; display:flex; align-items:center; gap:10px; padding:8px 12px; margin:0 0 14px;
             background:color-mix(in srgb, var(--card) 88%, var(--bg)); border:1px solid var(--line); border-radius:var(--radius-sm); backdrop-filter:blur(6px); }
  .savebar .dirty { color:var(--warn); font-size:12.5px; display:none; }
  .savebar.is-dirty .dirty { display:inline; }
  .savebar input { flex:1; min-width:120px; font-size:12.5px; padding:6px 9px; }
  .savebar button { padding:7px 14px; font-size:13px; }

  section.area { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; }
  section.area > h3 { margin:0 0 10px; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.02em; display:flex; align-items:center; gap:8px; }
  section.area > h3 small { color:var(--muted); font-weight:400; font-size:11px; direction:ltr; unicode-bidi:isolate; }
  .frow { display:grid; grid-template-columns:150px minmax(0,1fr); gap:8px 14px; align-items:start; padding:7px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .frow:last-child { border-bottom:none; }
  .frow label { font-size:12.5px; color:var(--muted); padding-top:8px; }
  .frow label small { display:block; font-size:10.5px; direction:ltr; text-align:right; opacity:.8; }
  .frow .v { font-size:14px; unicode-bidi:isolate; min-height:20px; padding-top:6px; }
  .frow .v.mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12.5px; direction:ltr; text-align:right; }
  .frow input, .frow textarea, .frow select { font-size:14px; }
  .frow textarea { min-height:70px; }
  .frow textarea.tall { min-height:150px; }
  .bi { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:10px; direction:rtl; }
  .bi .he { direction:rtl; text-align:right; }
  .bi .en textarea, .bi .en input { direction:ltr; text-align:left; font-family:Georgia,'Times New Roman',serif; background:var(--en-tint); }
  .bi .he textarea, .bi .he input { background:var(--he-tint); }
  .bi .cap { font-size:10.5px; color:var(--muted); margin-bottom:3px; }
  .bi .en .cap { direction:ltr; text-align:left; }
  .changed { border-color:var(--warn) !important; }

  /* lists inside the card (dates / notes) */
  .list { display:flex; flex-direction:column; gap:6px; }
  .li { display:flex; gap:10px; align-items:flex-start; padding:8px 10px; background:var(--tint); border:1px solid var(--line); border-radius:var(--radius-sm); font-size:13px; }
  .li .body { flex:1; min-width:0; unicode-bidi:isolate; white-space:pre-wrap; }
  .li .body.en { direction:ltr; text-align:left; font-family:Georgia,serif; }
  .li .meta { color:var(--muted); font-size:11px; white-space:nowrap; }
  .li .src { font-size:10.5px; padding:1px 6px; border-radius:4px; background:var(--card); border:1px solid var(--line); color:var(--muted); }
  .li .src.human { color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
  .li button.x { background:transparent; color:var(--muted); border:1px solid var(--line); padding:1px 7px; font-size:12px; }
  .li button.x:hover { color:var(--error); border-color:var(--error); box-shadow:none; background:transparent; }
  .addrow { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:end; }
  .addrow .fields { flex:1; min-width:260px; display:grid; grid-template-columns:minmax(160px,2fr) minmax(120px,1fr) auto auto; gap:8px; align-items:center; }
  .addrow .fields.note { grid-template-columns:auto auto minmax(160px,1fr); }
  @media (max-width:1100px) { .addrow .fields, .addrow .fields.note { grid-template-columns:1fr 1fr; } }
  .addrow input, .addrow select, .addrow textarea { font-size:13px; padding:7px 9px; min-height:0; }
  .addrow button { padding:7px 12px; font-size:12.5px; white-space:nowrap; }
  .chk { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); white-space:nowrap; }

  /* rail */
  .rail h4 { margin:14px 0 6px; font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.03em; }
  .rail h4:first-child { margin-top:0; }
  .rail .box { background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; }
  .flow { display:flex; flex-direction:column; gap:6px; }
  .flow button { width:100%; padding:8px 12px; font-size:13px; text-align:right; }
  .flow button.secondary { font-weight:600; }
  .blockers { margin-top:8px; font-size:12.5px; color:var(--warn); }
  .blockers li { margin:2px 0; }
  .ent { display:flex; align-items:center; gap:6px; padding:5px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent); font-size:13px; }
  .ent:last-child { border-bottom:none; }
  .ent .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; unicode-bidi:isolate; }
  .ent .n small { color:var(--muted); font-size:11px; margin-inline-start:5px; direction:ltr; unicode-bidi:isolate; }
  .ent .cand { font-size:10px; color:var(--tik); border:1px solid color-mix(in srgb, var(--tik) 50%, transparent); border-radius:4px; padding:0 5px; }
  .ent .appr { font-size:10px; color:var(--good); border:1px solid color-mix(in srgb, var(--good) 50%, transparent); border-radius:4px; padding:0 5px; }
  .ent .role { font-size:10.5px; color:var(--muted); }
  .ent a { color:var(--accent); text-decoration:none; font-size:11px; direction:ltr; unicode-bidi:isolate; }
  .more { color:var(--muted); font-size:11.5px; margin-top:4px; }
  .file { font-size:12px; padding:5px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .file:last-child { border-bottom:none; }
  .file .p { direction:ltr; text-align:left; unicode-bidi:isolate; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11px; color:var(--muted); word-break:break-all; }
  .ver { font-size:12.5px; padding:6px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent); cursor:pointer; }
  .ver:last-child { border-bottom:none; }
  .ver:hover { color:var(--accent); }
  .ver .w { color:var(--muted); font-size:11px; }
  .diff { margin-top:8px; font-size:12px; background:var(--tint); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 10px; display:none; }
  .diff.show { display:block; }
  .diff .f { font-weight:700; color:var(--muted); margin-top:6px; font-size:11px; }
  .diff .old { color:var(--error); text-decoration:line-through; opacity:.8; white-space:pre-wrap; unicode-bidi:isolate; }
  .diff .new { color:var(--good); white-space:pre-wrap; unicode-bidi:isolate; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12px; color:var(--muted); }
  .kv b { color:var(--ink); font-weight:600; unicode-bidi:isolate; }

  /* new-node form */
  .newnode { padding:10px 12px; border-top:1px solid var(--line); display:none; background:var(--card); }
  .newnode.show { display:block; }
  .newnode .g { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
  .newnode input, .newnode select { font-size:12.5px; padding:6px 8px; }
  .newnode .t { font-size:12px; color:var(--muted); margin-bottom:6px; }

  /* toast */
  #toast { position:fixed; bottom:18px; left:18px; z-index:50; background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:10px 16px; font-size:13.5px; box-shadow:0 12px 30px -10px rgba(0,0,0,.7); opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s; pointer-events:none; max-width:min(520px, 90vw); }
  #toast.show { opacity:1; transform:none; }
  #toast.ok { border-color:var(--good); } #toast.err { border-color:var(--error); }

  @media (max-width:1180px) { :root { --rail-w:280px; --tree-w:260px; } }
  @media (max-width:1100px) { .frow { grid-template-columns:1fr; gap:4px; } .frow label { padding-top:0; } .frow label small { display:inline; margin-inline-start:6px; } }
  @media (max-width:980px) {
    .layout { grid-template-columns:var(--tree-w) minmax(0,1fr); }
    .rail { grid-column:1 / -1; position:static; height:auto; border-inline-end:none; border-top:1px solid var(--line); }
  }
  @media (max-width:700px) {
    .layout { grid-template-columns:1fr; }
    .tree-pane { position:static; height:auto; max-height:45vh; border-inline-start:none; border-bottom:1px solid var(--line); }
    .frow { grid-template-columns:1fr; } .frow label { padding-top:0; }
    .bi { grid-template-columns:1fr; }
    .topbar { flex-wrap:wrap; gap:8px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a href="index.html" style="text-decoration:none"><button type="button" class="gear">← דף הבית</button></a>
    <h1>ניהול הארכיון<span class="tenant" id="tenant"></span></h1>
    <a href="entities.html" style="text-decoration:none"><button type="button" class="gear">👥 ישויות וקישורים</button></a>
    <button type="button" class="gear" id="btn-integration" title="המתג בין מערכת הקטלוג למאגר: קליטה אוטומטית של כל עבודה שמסתיימת">🔌 חיבור למערכת הקטלוג<span id="integ-dot"></span></button>
    <div class="grow"></div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="layout">
    <aside class="pane tree-pane" id="tree-pane">
      <div class="tree-head">
        <input type="text" id="q" placeholder="חיפוש בעץ — כותר, תיאור, מספר-ייחוס…" autocomplete="off">
        <div class="tree-tools">
          <select id="f-level" title="רמה"><option value="">כל הרמות</option></select>
          <select id="f-status" title="סטטוס"><option value="">כל הסטטוסים</option></select>
          <button type="button" class="gear" id="btn-new-root" title="יחידת-תיאור חדשה ברמת השורש">＋ חטיבה</button>
        </div>
        <div class="cat-strip" id="cat-strip"></div>
      </div>
      <div class="move-banner" id="move-banner"></div>
      <div class="tree-body" id="tree-body"><div class="tree-empty">טוען…</div></div>
      <div class="newnode" id="newnode">
        <div class="t" id="newnode-title">יחידה חדשה</div>
        <div class="g">
          <select id="nn-level"></select>
          <input type="text" id="nn-ref" placeholder="מספר-ייחוס (ref_code)" style="direction:ltr;text-align:left">
        </div>
        <div class="g" id="nn-catalog-row" style="grid-template-columns:1fr">
          <select id="nn-catalog" title="קטלוג ספיר — ליחידה ברמת השורש; רשומת-בת יורשת מהאב"></select>
        </div>
