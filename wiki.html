<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עץ הידע — ויקי הארכיון</title>
<link rel="stylesheet" href="yv-theme.css?v=20260823a">
<style>
  :root { --accent:var(--tik); }
  html, body { height:100%; }
  body { padding:14px 20px; display:flex; flex-direction:column; direction:rtl; text-align:right; }
  .top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:8px; }
  h1 { font-size:20px; margin:0; font-weight:800; }
  .sub { color:var(--muted); font-size:12.5px; }
  .srow { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
  .srow input { direction:ltr; text-align:left; padding:5px 9px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--tint); color:var(--ink); font-family:inherit; font-size:12.5px; min-width:200px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 14px; margin-bottom:10px; font-size:13px; }
  #q { min-width:240px; flex:1; padding:8px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--tint); color:var(--ink); font-family:inherit; font-size:14px; direction:rtl; text-align:right; }
  button.act, a.act { padding:7px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--tint); color:var(--ink); font-family:inherit; font-size:13px; cursor:pointer; text-decoration:none; }
  button.act.primary { background:var(--accent); color:#150a22; font-weight:700; border-color:var(--accent); }
  .stats { color:var(--muted); font-size:12px; margin-inline-start:auto; }
  .main { flex:1; min-height:0; display:flex; gap:12px; }
  #tree { width:380px; flex:none; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; overflow:auto; font-size:13px; }
  #tree details { margin:2px 0; } #tree summary { cursor:pointer; font-weight:700; padding:3px 4px; border-radius:6px; }
  #tree summary:hover { background:var(--card-hover); } #tree summary .n { color:var(--muted); font-weight:400; font-size:11.5px; }
  #tree .leaf { display:block; padding:2px 18px 2px 4px; color:var(--ink); text-decoration:none; cursor:pointer; border-radius:6px; }
  #tree .leaf:hover { background:var(--card-hover); color:var(--accent); } #tree .leaf.on { background:var(--accent); color:#150a22; }
  #tree .leaf small { color:var(--muted); }
  #tree .more { color:var(--muted); font-size:11.5px; padding:2px 18px; }
  #page { flex:1; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px; overflow:auto; font-size:14px; line-height:1.65; }
  #page h1 { font-size:20px; } #page h2 { font-size:16px; margin:14px 0 6px; } #page h3 { font-size:14px; margin:12px 0 4px; color:var(--muted); } #page h4 { font-size:13.5px; margin:10px 0 3px; }
  #page ul { padding-right:20px; padding-left:0; } #page li { margin:2px 0; unicode-bidi:isolate; }
  #page a.wl { color:var(--accent); text-decoration:none; } #page a.wl:hover { text-decoration:underline; } #page a.ext { color:var(--docs); }
  #page .managed { color:var(--muted); font-size:11px; margin:8px 0 2px; border-top:1px dashed var(--line); padding-top:3px; }
  #page .members { background:var(--tint); padding:6px 10px; border-radius:6px; font-size:12.5px; }
  .crumbs { font-size:12.5px; color:var(--muted); margin-bottom:6px; } .crumbs a { color:var(--accent); text-decoration:none; cursor:pointer; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 10px; }
  .prop { background:var(--tint); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; margin:8px 0; font-size:13px; }
  .prop .pt { font-weight:700; } .prop .pm { color:var(--muted); font-size:11.5px; } .prop .pb { white-space:pre-wrap; margin:6px 0; }
  .empty { color:var(--muted); text-align:center; padding:30px 10px; }
  .msg { font-size:12.5px; color:var(--muted); }
  @media (max-width: 900px) { .main { flex-direction:column; } #tree { width:auto; max-height:38vh; } }
</style>
</head>
<body>
<div class="top">
  <a href="index.html" style="text-decoration:none"><button type="button" class="gear" style="border-radius:7px;padding:8px 16px;font-size:14px;">← דף הבית</button></a>
  <div>
    <h1>📚 עץ הידע — ויקי הארכיון</h1>
    <div class="sub">אוסף ← תיק ← ישויות · נושאים · אזורים ומקומות · שנים · ארגונים — דפי-מוקד שנבנים מהרשומות (בלוק מנוהל) + מבוא סינתטי מצוטט שעובר סקירה. תצוגה ותחזוקה; מקור-האמת נשאר ברשומות.</div>
  </div>
  <div class="srow" style="margin-inline-start:auto"><span>שרת:</span><input type="text" id="server-url" placeholder="ריק = אותו שרת" autocomplete="off"></div>
</div>
<div class="toolbar">
  <input type="text" id="q" placeholder="חיפוש בעץ — אדם / מקום / תיק / נושא / שנה" autocomplete="off">
  <button type="button" class="act" id="hubs" title="בנייה מחדש של דפי-המוקד מהרשומות והאוספים (ללא מודל)">🌳 בנה מוקדים</button>
  <button type="button" class="act" id="proposals" title="הצעות-סינתזה הממתינות לסקירה">📝 הצעות לסקירה</button>
  <a class="act" id="graph-link" href="graph.html">🕸️ הגרף</a>
  <span class="stats" id="stats">טוען…</span>
</div>
<div class="main">
  <div id="tree"><div class="empty">טוען את העץ…</div></div>
  <div id="page"><div class="empty">בחרו צומת בעץ, או פתחו את <a class="wl" data-page="index.md" href="wiki.html?page=index.md">index.md</a>.</div></div>
</div>
<script src="yv-wikimd.js?v=20260915a"></script>
<script src="wiki.inline1.js?v=20260915b"></script>
</body>
</html>
